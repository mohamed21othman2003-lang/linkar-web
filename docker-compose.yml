# Running Linkar on a server:
#   docker compose up -d --build     <- build and start
#   docker compose logs -f web       <- follow logs (or "admin" for the control panel)
#   docker compose down              <- stop (the image cache volume is kept)
#
# Settings come from .env next to this file (copy .env.example -> .env and edit).
# Two services: web = customer website · admin = Linkar control panel (admin.linkarksa.com).
# Both still run on demo data inside the code (no backend or database yet).

services:
  web:
    build:
      context: .
      args:
        # Final domain — baked in at build time into sitemap.xml and robots.txt
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://linkar-web.vercel.app}
    image: linkar-web:latest
    container_name: linkar-web
    ports:
      # Loopback only by default (published through nginx / a reverse proxy).
      # Without a proxy, set BIND_ADDR=0.0.0.0 in .env
      - "${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    volumes:
      # Optimized image cache (AVIF/WebP) kept between deploys
      - next_image_cache:/app/.next/cache/images
    restart: unless-stopped

  admin:
    build:
      context: ./admin
      args:
        # Backend API URL once it exists (empty = demo data)
        NEXT_PUBLIC_API_URL: ${ADMIN_API_URL:-}
    image: linkar-admin:latest
    container_name: linkar-admin
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${ADMIN_PORT:-3001}:3000"
    restart: unless-stopped

volumes:
  next_image_cache:
